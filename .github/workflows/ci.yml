name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-core:
    name: Test @termwright/core
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install

      - name: Typecheck core
        run: bun run --filter @termwright/core typecheck

      - name: Test core
        run: bun run --filter @termwright/core test

  test-mcp-server:
    name: Test @termwright/mcp-server
    runs-on: ubuntu-latest
    needs: test-core

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build core first (for types)
        run: bun run --filter @termwright/core build

      - name: Typecheck mcp-server
        run: bun run --filter @termwright/mcp-server typecheck

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: [test-core, test-mcp-server]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Verify core build artifacts
        run: |
          test -f packages/core/dist/index.js
          test -f packages/core/dist/index.d.ts

      - name: Verify mcp-server build artifacts
        run: |
          test -f packages/mcp-server/dist/server.js
          test -f packages/mcp-server/dist/web-server.js
